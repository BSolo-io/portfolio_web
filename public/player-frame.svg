<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="400" height="680" role="img" aria-label="Music player frame">
  <!-- ==========================================================
       MUSIC PLAYER FRAME  —  transparent background
       The art window is a real hole punched through the body.
       Window, in viewBox units:  x=42  y=42  w=316  h=316  r=18
       As a percentage of the SVG: left 10.5%  top 6.18%
                                   width 79%   height 46.47%
       ========================================================== -->

  <!-- body with the window cut out (fill-rule="evenodd") -->
  <path fill="#6E7276" fill-rule="evenodd"
        d="M44 10 H356 A34 34 0 0 1 390 44 V626 A34 34 0 0 1 356 670 H44 A34 34 0 0 1 10 626 V44 A34 34 0 0 1 44 10 Z
           M60 42 H340 A18 18 0 0 1 358 60 V340 A18 18 0 0 1 340 358 H60 A18 18 0 0 1 42 340 V60 A18 18 0 0 1 60 42 Z"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- TITLE -->
    <text x="42" y="400" fill="#fff" fill-opacity=".95" font-size="18" font-weight="600">Software Engineer</text>
    <!-- SUBTITLE — delete this line if you don't want it -->
    <text x="42" y="424" fill="#fff" fill-opacity=".55" font-size="14">Borys Solorzano</text>

    <!-- scrubber -->
    <rect x="42" y="468" width="316" height="4" rx="2" fill="#fff" fill-opacity=".3"/>
    <rect x="42" y="468" width="190" height="4" rx="2" fill="#fff" fill-opacity=".92"/>
    <circle cx="232" cy="470" r="5.5" fill="#fff"/>
    <text x="42" y="494" fill="#fff" fill-opacity=".65" font-size="12">1:53</text>
    <text x="358" y="494" fill="#fff" fill-opacity=".65" font-size="12" text-anchor="end">−1:20</text>
  </g>

  <!-- transport controls -->
  <g fill="#fff">
    <path d="M144 530 V560 L123 545 Z"/>
    <path d="M123 530 V560 L102 545 Z"/>
    <rect x="189" y="529" width="7" height="32" rx="2.5"/>
    <rect x="204" y="529" width="7" height="32" rx="2.5"/>
    <path d="M256 530 V560 L277 545 Z"/>
    <path d="M277 530 V560 L298 545 Z"/>
  </g>

  <!-- volume -->
  <g fill="#fff" fill-opacity=".9">
    <path d="M44 610 H48 L53.6 604.4 V623.6 L48 618 H44 Z"/>
    <rect x="72" y="612" width="254" height="4" rx="2" fill="#fff" fill-opacity=".3"/>
    <rect x="72" y="612" width="203" height="4" rx="2" fill="#fff" fill-opacity=".92"/>
    <circle cx="275" cy="614" r="9" fill="#fff" fill-opacity="1"/>
    <path d="M336 610 H340 L345.6 604.4 V623.6 L340 618 H336 Z"/>
    <path d="M348.8 609.2 a7.2 7.2 0 0 1 0 9.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M352.8 605.2 a12.8 12.8 0 0 1 0 17.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
